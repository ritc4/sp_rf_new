input:
  postgres_cdc:
    dsn: "postgres://yugabyte:yugabyte@yugabytedb:5433/catalog_db?sslmode=disable"
    slot_name: "rp_connect_catalog_slot"
    tables:
      - "public.products"
      - "public.outbox_events"
    stream_snapshot: true

pipeline:
  processors:
    - mapping: |
        meta table = @table

output:
  broker:
    pattern: fan_out
    outputs:
      # 1. Прямое обновление кэша в Dragonfly (заменяет Go cache-worker)
      - redis:
          url: "redis://dragonfly:6379"
          command: set
          args_mapping: |
            root = if meta("table") == "products" && this.id != null {
              [
                "catalog:product:" + this.id.string(),
                {
                  "product_id": this.id.string(),
                  "title": this.title.or(""),
                  "owner_id": this.owner_id.or(""),
                  "jsonb_attributes": this.jsonb_attributes.string()
                }.format_json(),
                "EX",
                "86400"
              ]
            } else {
              deleted()
            }

      # 2. Доставка живых уведомлений в Centrifugo из Transactional Outbox
      - http_client:
          url: "http://centrifugo:8000/api"
          verb: POST
          headers:
            Content-Type: "application/json"
            X-API-Key: "${CENTRIFUGO_API_KEY:centrifugo_api_key_2026_secret}"
        processors:
          - mapping: |
              root = if meta("table") == "outbox_events" {
                {
                  "method": "publish",
                  "params": {
                    "channel": this.channel.or("live-updates:products"),
                    "data": this.payload.parse_json().catch(this.payload)
                  }
                }
              } else {
                deleted()
              }

      # 3. Архив всех событий в Redpanda (Kafka) для аналитики и аудита
      - redpanda:
          addresses: [ "redpanda:9092" ]
          topic: "yugabyte.catalog_db.public.products"
        processors:
          - mapping: |
              root = if meta("table") == "products" { this } else { deleted() }
