syntax = "proto3";

package platform;

option go_package = "joint-purchases/core-go/proto;proto";

service CatalogService {
  rpc GetProduct (ProductRequest) returns (ProductResponse);
  rpc AddProduct (AddProductRequest) returns (AddProductResponse);
}

message ProductRequest {
  string product_id = 1;
}

message ProductResponse {
  string product_id = 1;
  string title = 2;
  string jsonb_attributes = 3;
  string source = 4;
}

message AddProductRequest {
  string product_id = 1;
  string title = 2;
  string owner_id = 3;
  string jsonb_attributes = 4;
}

message AddProductResponse {
  string status = 1;
  string product_id = 2;
}
