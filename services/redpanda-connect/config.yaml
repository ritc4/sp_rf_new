input:
  postgres_cdc:
    # Подключаемся к YugabyteDB (она полностью совместима с протоколом Postgres)
    dsn: "postgres://yugabyte:yugabyte@yugabytedb:5433/yugabyte?sslmode=disable"
    # Уникальное имя слота репликации в базе данных
    slot_name: "rp_connect_cdc_slot"
    # Автоматически сделать слепок текущих данных, если слот создается впервые
    stream_snapshot: true

output:
  redpanda:
    addresses: [ "redpanda:9092" ]
    topic: "cdc_events"