services:
  # 1. API Шлюз KrakenD
  krakend:
    image: krakend:3.0.3
    container_name: krakend
    volumes:
      - ./infra/krakend:/etc/krakend
    ports:
      - "8080:8080"
    command: ["run", "-c", "/etc/krakend/krakend.json"]
    networks:
      - platform-network
    depends_on:
      - core-go
    restart: on-failure

  # 2. Фронтенд на Qwik City
  web-qwik:
    build:
      context: .
      dockerfile: ./apps/web-qwik/Dockerfile
    container_name: web-qwik
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    networks:
      - platform-network
    depends_on:
      - krakend
    restart: on-failure

  # 3. Микросервис CORE (Единый BFF-шлюз, Auth, Singleflight, Cache Read, JWT для Centrifugo)
  core-go:
    build:
      context: .
      dockerfile: ./apps/core-go/Dockerfile
    container_name: core-go
    ports:
      - "8081:8081"
      - "8082:8082"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-lgtm:4317
      - JWT_SECRET=my_super_secret_key_2026_enterprise_top_level
      - CENTRIFUGO_SECRET=centrifugo_secret_key_2026_top_level
      - YUGABYTE_DB_URL=postgres://yugabyte:yugabyte@yugabytedb:5433/yugabyte
      - DRAGONFLY_URL=dragonfly:6379
      - DATA_GRPC_ADDR=data-python:50051
      - GOPROXY=direct
    networks:
      - platform-network
    depends_on:
      - yugabytedb
      - dragonfly
      - data-python
      - otel-lgtm
    restart: on-failure

  # 4. Микросервис DATA (Изолирован внутри сети без внешнего порта! Только для core-go)
  data-python:
    build:
      context: .
      dockerfile: ./apps/data-python/Dockerfile
    container_name: data-python
    expose:
      - "50051"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4317
      - DATABASE_URL=postgresql://yugabyte:yugabyte@yugabytedb:5433/catalog_db
    networks:
      - platform-network
    depends_on:
      - yugabytedb
      - otel-lgtm
    restart: on-failure

  # 5. Real-Time Push Сервер Centrifugo (Закрытый режим по JWT)
  centrifugo:
    image: centrifugo/centrifugo:v5.4.9
    container_name: centrifugo
    volumes:
      - ./infra/centrifugo:/centrifugo
    ports:
      - "8000:8000"
    command: centrifugo --config=config.json
    networks:
      - platform-network
    depends_on:
      - dragonfly
    restart: on-failure

  # 6. Событийная шина Redpanda (Kafka-контур)
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: redpanda
    command: [
      "redpanda", "start",
      "--mode", "dev-container",
      "--kafka-addr", "internal://0.0.0.0:9092,external://0.0.0.0:19092",
      "--advertise-kafka-addr", "internal://redpanda:9092,external://localhost:19092",
      "--smp", "1",
      "--memory", "768M"
    ]
    ports:
      - "19092:19092"
    networks:
      - platform-network
    deploy:
      resources:
        limits:
          memory: 1g

  # # 7. Распределенная NewSQL база данных YugabyteDB
  # yugabytedb:
  #   image: yugabytedb/yugabyte:2024.2.1.0-b185
  #   container_name: yugabytedb
  #   command: [
  #     "/home/yugabyte/bin/yugabyted", "start",
  #     "--daemon=false",
  #     "--master_flags=memory_limit_hard_bytes=536870912",
  #     "--tserver_flags=memory_limit_hard_bytes=536870912"
  #   ]
  #   ports:
  #     - "7000:7000"
  #     - "5433:5433"
  #   networks:
  #     - platform-network
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 1.5g


  # 7. Легкая PostgreSQL 17 с включенным CDC (wal_level=logical) вместо тяжелой YugabyteDB для разработки
  yugabytedb:
    image: postgres:17-alpine
    container_name: yugabytedb
    environment:
      - POSTGRES_USER=yugabyte
      - POSTGRES_PASSWORD=yugabyte
      - POSTGRES_DB=yugabyte
    command: ["postgres", "-p", "5433", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    ports:
      - "5433:5433"
    networks:
      - platform-network
    restart: on-failure

  # 8. Кэш-движок Dragonfly
  dragonfly:
    image: ghcr.io/dragonflydb/dragonfly:v1.26.1
    container_name: dragonfly
    ports:
      - "6379:6379"
    command: ["dragonfly", "--proactor_threads=2"]
    networks:
      - platform-network

  # 9. Единый CDC-конвейер: Redpanda Connect (Dragonfly + Centrifugo + Redpanda)
  redpanda-connect:
    image: docker.redpanda.com/redpandadata/connect:latest
    container_name: redpanda-connect
    volumes:
      - ./infra/redpanda-connect:/etc/redpanda-connect
    environment:
      - CENTRIFUGO_API_KEY=centrifugo_api_key_2026_secret
    command: ["run", "/etc/redpanda-connect/config.yaml"]
    networks:
      - platform-network
    deploy:
      resources:
        limits:
          memory: 256m
    depends_on:
      - redpanda
      - yugabytedb
      - data-python
      - centrifugo
    restart: on-failure

  # 10. Единый стек наблюдаемости (Loki, Grafana, Tempo, Mimir + OTel Collector)
  otel-lgtm:
    image: grafana/otel-lgtm:0.8.2
    container_name: otel-lgtm
    ports:
      - "3001:3000"
      - "4317:4317"
      - "4318:4318"
    networks:
      - platform-network
    deploy:
      resources:
        limits:
          memory: 800m

  # 11. Агент-сборщик логов всех контейнеров в Loki
  alloy:
    image: grafana/alloy:v1.5.1
    container_name: grafana-alloy
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    networks:
      - platform-network
    depends_on:
      - otel-lgtm
    restart: unless-stopped

networks:
  platform-network:
    driver: bridge
